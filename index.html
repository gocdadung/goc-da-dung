<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Góc Đã Dùng — sản phẩm mình từng trải nghiệm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F4EFE3;
    --card: #FBF8F1;
    --ink: #2B3A2E;
    --ink-soft: #6B6357;
    --line: #DCD4C0;
    --sage: #B9C4A9;
    --clay: #A9825C;
    --banner-bg: #2B3A2E;
    --banner-text: #F4EFE3;
    --banner-text-soft: #C7CFC1;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.5;
  }

  header{
    background: var(--banner-bg);
    color: var(--banner-text);
  }

  header .header-inner{
    max-width: 960px;
    margin: 0 auto;
    padding: 56px 24px 40px;
  }

  header h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2rem, 5vw, 2.8rem);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
    color: var(--banner-text);
  }

  header p{
    max-width: 46ch;
    color: var(--banner-text-soft);
    font-size: 1.02rem;
    margin: 0;
  }

  nav{
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    border-bottom: 1px solid var(--line);
  }

  .nav-inner{
    max-width: 960px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    overflow-x: auto;
  }

  nav a{
    display: block;
    color: var(--ink);
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 500;
    white-space: nowrap;
    padding: 10px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    border-bottom: 3px solid var(--line);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }

  nav a:hover{
    transform: translateY(-3px);
    border-bottom-color: var(--clay);
    box-shadow: 0 6px 14px rgba(43,58,46,0.12);
  }

  main{
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  section.category{
    padding-top: 56px;
    scroll-margin-top: 76px;
  }

  section.category h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.5rem;
    margin: 0 0 4px;
  }

  section.category .count{
    color: var(--ink-soft);
    font-size: 0.88rem;
    margin: 0 0 24px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
  }

  @media (max-width: 700px){
    .grid{ grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 480px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }

  .item a.thumb{
    display: block;
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--line);
  }

  .item img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .3s ease;
  }

  .item a.thumb:hover img{
    transform: scale(1.04);
  }

  .item .name{
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--ink);
  }

  .item.extra{ display: none; }

  section.category.expanded .item.extra{ display: block; }

  .view-all-wrap{
    margin-top: 20px;
  }

  .view-all{
    font-family: 'Work Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--clay);
    background: none;
    border: none;
    border-bottom: 1px solid var(--clay);
    padding: 0 0 2px;
    cursor: pointer;
  }

  .view-all:hover{ color: var(--ink); border-color: var(--ink); }

  /* Thanh menu hạng mục trên mobile: hiện đủ 6 ô cùng lúc, không cần vuốt ngang */
  @media (max-width: 640px){
    .nav-inner{
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      overflow-x: visible;
      padding: 14px 16px;
    }
    nav a{
      text-align: center;
      white-space: normal;
      padding: 10px 6px;
      font-size: 0.78rem;
    }
  }

  footer{
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 64px;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 0.85rem;
  }

  footer a{ color: var(--clay); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Góc Đã Dùng</h1>
    <p>Những món mình thực sự dùng qua và thấy đáng để nhắc lại — sắp theo từng nhóm nhỏ cho dễ tìm.</p>
  </div>
</header>

<nav><div class="nav-inner" id="catNav"></div></nav>

<main id="main"></main>

<footer>
  Trang này có chứa liên kết tiếp thị liên kết (affiliate) tới Shopee. Khi bạn mua hàng qua các liên kết này, mình có thể nhận được một khoản hoa hồng nhỏ, không phát sinh thêm chi phí cho bạn.
</footer>

<script>
/* ============================================================

   ============================================================

   - name: tên hạng mục (hiển thị làm tiêu đề section + menu)
   - items: danh sách sản phẩm trong hạng mục đó
       - name: tên sản phẩm
       - image: link ảnh sản phẩm (có thể lấy từ ảnh Shopee hoặc ảnh tự chụp upload lên đâu đó)
       - link: link Shopee affiliate của sản phẩm (lấy từ mục Generate Link trên affiliate.shopee.vn)

   Muốn thêm hạng mục mới: copy nguyên một object { name: ..., items: [...] }
   và dán vào cuối mảng, trước dấu ] đóng.

   Muốn thêm sản phẩm: copy nguyên một dòng { name:..., image:..., link:... }
   trong "items" của hạng mục tương ứng.

   LƯU Ý: trang chủ chỉ hiện CỐ ĐỊNH 5 sản phẩm đầu tiên của mỗi hạng mục.
   Từ sản phẩm thứ 6 trở đi sẽ tự động ẩn, người xem bấm "Xem tất cả" mới thấy hết.
   Muốn đổi số lượng hiện mặc định, sửa biến VISIBLE_COUNT bên dưới.
   ============================================================ */

const CATEGORIES = [

      { name: "Máy xông ngải cứu", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },
      { name: "Lược diện chẩn", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },

    ]

      { name: "Trà dưỡng huyết", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },
      { name: "Chè dưỡng nhan", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },
      { name: "Trà thảo mộc", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },
      { name: "Trà hoa cúc", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },
      { name: "Ngũ cốc hạt", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" }
    ]
  },
  {

    items: [

      { name: "Phô mai mặn", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },

      { name: "Hộp nhựa đựng pizza", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" }
    ]
  },
  {
    name: "Sách & Dụng Cụ Học Tập",
    items: [
      { name: "Cặp xách", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },

    ]
  },
  {
    name: "Sân Vườn",
    items: [
      { name: "Đèn LED sân vườn", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },
      { name: "Máy bơm hồ cá", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },

    ]
  },
  {

    items: [

      { name: "Chuông xoay Tây Tạng", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },
      { name: "Gỗ thánh Palo Santo", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },
      { name: "Xô thanh tẩy", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },
      { name: "Đế đốt trầm", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" },
      { name: "Đá thanh tẩy", image: "https://placehold.co/400x400/EFE8D8/6B6357?text=Anh+san+pham", link: "https://shopee.vn/" }
    ]
  }
];

/* ============================================================
   PHẦN DƯỚI ĐÂY LÀ CODE HIỂN THỊ — không cần chỉnh sửa
   ============================================================ */

function slugify(str){
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-");
}

const nav = document.getElementById("catNav");
const main = document.getElementById("main");

CATEGORIES.forEach(cat => {
  const slug = slugify(cat.name);

  const navLink = document.createElement("a");
  navLink.href = "#" + slug;
  navLink.textContent = cat.name;
  nav.appendChild(navLink);

  const section = document.createElement("section");
  section.className = "category";
  section.id = slug;

  const h2 = document.createElement("h2");
  h2.textContent = cat.name;
  section.appendChild(h2);

  const count = document.createElement("p");
  count.className = "count";
  count.textContent = cat.items.length + " sản phẩm";
  section.appendChild(count);

  const grid = document.createElement("div");
  grid.className = "grid";

  cat.items.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "item" + (index >= VISIBLE_COUNT ? " extra" : "");
    div.innerHTML = `
      <a class="thumb" href="${item.link}" target="_blank" rel="noopener sponsored">
        <img src="${item.image}" alt="${item.name}" loading="lazy">
      </a>
      <div class="name">${item.name}</div>
    `;
    grid.appendChild(div);
  });

  section.appendChild(grid);

  if(cat.items.length > VISIBLE_COUNT){
    const wrap = document.createElement("div");
    wrap.className = "view-all-wrap";
    const btn = document.createElement("button");
    btn.className = "view-all";
    btn.textContent = "Xem tất cả (" + cat.items.length + " sản phẩm)";
    btn.addEventListener("click", () => {
      const expanded = section.classList.toggle("expanded");
      btn.textContent = expanded
        ? "Thu gọn"
        : "Xem tất cả (" + cat.items.length + " sản phẩm)";
    });
    wrap.appendChild(btn);
    section.appendChild(wrap);
  }

  main.appendChild(section);
});
</script>
