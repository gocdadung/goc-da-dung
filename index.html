<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Góc Đã Dùng — sản phẩm mình từng trải nghiệm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F4EFE3;
    --band-b: #ECE4D2;
    --card: #FFFFFF;
    --ink: #2B3A2E;
    --ink-soft: #6B6357;
    --line: #DCD4C0;
    --sage: #B9C4A9;
    --clay: #A9825C;
    --clay-dark: #8A6741;
    --banner-bg: #2B3A2E;
    --banner-text: #F4EFE3;
    --banner-text-soft: #C7CFC1;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.5;
  }

  header{
    background: var(--banner-bg);
    color: var(--banner-text);
  }

  header .header-inner{
    max-width: 960px;
    margin: 0 auto;
    padding: 56px 24px 40px;
  }

  header h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2rem, 5vw, 2.8rem);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
    color: var(--banner-text);
  }

  header p{
    max-width: 46ch;
    color: var(--banner-text-soft);
    font-size: 1.02rem;
    margin: 0;
  }

  nav{
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    border-bottom: 1px solid var(--line);
  }

  /* fade mép phải báo hiệu còn tab bị che khi cuộn ngang */
  nav::after{
    content:"";
    position:absolute;
    top:0; right:0; bottom:0;
    width:44px;
    background: linear-gradient(to right, transparent, var(--bg) 75%);
    pointer-events:none;
  }

  .nav-inner{
    max-width: 960px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    overflow-x: auto;
    position: relative;
  }

  nav a{
    display: block;
    color: var(--ink);
    text-decoration: none;
    font-size: 0.88rem;
    font-weight: 500;
    white-space: nowrap;
    padding: 10px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    border-bottom: 3px solid var(--line);
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
  }

  nav a:hover{
    transform: translateY(-3px);
    border-bottom-color: var(--clay);
    box-shadow: 0 6px 14px rgba(43,58,46,0.12);
  }

  /* tab đang chọn — dùng màu nhấn terracotta */
  nav a.active{
    background: var(--clay);
    border-color: var(--clay);
    color: #fff;
  }

  nav a.active:hover{
    transform: none;
  }

  /* mỗi mục nằm trong 1 "band" full-width để tạo sắc độ xen kẽ, dễ phân biệt mà vẫn cùng tông màu */
  .band{ width: 100%; }
  .band-a{ background: var(--bg); }
  .band-b{ background: var(--band-b); }

  .band-inner{
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px;
  }

  section.category{
    padding-top: 56px;
    padding-bottom: 56px;
    scroll-margin-top: 76px;
    border-top: 1px solid var(--line);
  }

  .band:first-of-type section.category{
    border-top: none;
  }

  section.category h2{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.5rem;
    margin: 0 0 4px;
    padding-bottom: 10px;
    position: relative;
  }

  /* chi tiết nhỏ terracotta dưới mỗi tiêu đề mục */
  section.category h2::after{
    content:"";
    display:block;
    position:absolute;
    left:0; bottom:0;
    width: 36px;
    height: 3px;
    border-radius: 2px;
    background: var(--clay);
  }

  section.category .count{
    color: var(--ink-soft);
    font-size: 0.88rem;
    margin: 0 0 24px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
  }

  @media (max-width: 700px){
    .grid{ grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 480px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }

  /* thẻ sản phẩm — trắng + bóng đổ nhẹ để nổi rõ trên nền */
  .item a.thumb{
    display: block;
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 1px 4px rgba(43,58,46,0.08);
    transition: box-shadow .2s ease, border-color .2s ease;
  }

  .item a.thumb:hover{
    box-shadow: 0 8px 18px rgba(43,58,46,0.16);
    border-color: var(--clay);
  }

  .item img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .3s ease;
  }

  .item a.thumb:hover img{
    transform: scale(1.04);
  }

  .item .name{
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--ink);
    font-weight: 500;
  }

  /* dòng cảm nhận cá nhân mỗi món */
  .item .note{
    margin-top: 4px;
    font-size: 0.8rem;
    font-style: italic;
    color: var(--ink-soft);
    line-height: 1.35;
  }

  /* nút hành động terracotta cho từng sản phẩm */
  .item .cta{
    display: inline-block;
    margin-top: 8px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--clay);
    color: #fff;
    font-size: 0.74rem;
    font-weight: 600;
    text-decoration: none;
    transition: background .15s ease;
  }

  .item .cta:hover{
    background: var(--clay-dark);
  }

  .item.extra{ display: none; }

  section.category.expanded .item.extra{ display: block; }

  /* sản phẩm thứ 6 (index 5): mobile luôn hiện, desktop coi như "extra" tới khi bấm Xem tất cả */
  @media (max-width: 700px){
    .item.mobile-visible{ display: block !important; }
  }

  .view-all-wrap{
    margin-top: 20px;
  }

  .view-all{
    font-family: 'Work Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    color: var(--clay);
    background: none;
    border: none;
    border-bottom: 1px solid var(--clay);
    padding: 0 0 2px;
    cursor: pointer;
  }

  .view-all:hover{ color: var(--clay-dark); border-color: var(--clay-dark); }

  /* mục chỉ có đúng 6 sản phẩm: mobile đã hiện đủ nên ẩn luôn nút Xem tất cả trên mobile */
  @media (max-width: 700px){
    .view-all-wrap.mobile-hide{ display: none; }
  }

  /* mục chưa có sản phẩm (vd Hot Trend lúc mới tạo) */
  .empty-note{
    color: var(--ink-soft);
    font-size: 0.92rem;
    font-style: italic;
    padding: 18px 20px;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 8px;
  }

  /* Thanh menu hạng mục trên mobile: hiện đủ 6 ô cùng lúc, không cần vuốt ngang */
  @media (max-width: 640px){
    nav::after{ display: none; }
    .nav-inner{
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      overflow-x: visible;
      padding: 14px 16px;
    }
    nav a{
      text-align: center;
      white-space: normal;
      padding: 10px 6px;
      font-size: 0.78rem;
    }
  }

  footer{
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 64px;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    font-size: 0.85rem;
  }

  footer a{ color: var(--clay); }
</style>
</head>

/* ============================================================
   PHẦN DƯỚI ĐÂY LÀ CODE HIỂN THỊ — không cần chỉnh sửa
   ============================================================ */

function slugify(str){
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-");
}

const nav = document.getElementById("catNav");
const main = document.getElementById("main");
const navLinks = [];
const sections = [];

CATEGORIES.forEach((cat, catIndex) => {
  const slug = slugify(cat.name);

  const navLink = document.createElement("a");
  navLink.href = "#" + slug;
  navLink.textContent = cat.name;
  nav.appendChild(navLink);
  navLinks.push(navLink);

  const band = document.createElement("div");
  band.className = "band " + (catIndex % 2 === 0 ? "band-a" : "band-b");

  const bandInner = document.createElement("div");
  bandInner.className = "band-inner";

  const section = document.createElement("section");
  section.className = "category";
  section.id = slug;

  const h2 = document.createElement("h2");
  h2.textContent = cat.name;
  section.appendChild(h2);

  if (cat.items.length === 0){
    const empty = document.createElement("p");
    empty.className = "empty-note";
    empty.textContent = "Đang cập nhật sản phẩm — quay lại sớm nhé!";
    section.appendChild(empty);
  } else {
    const count = document.createElement("p");
    count.className = "count";
    count.textContent = cat.items.length + " sản phẩm";
    section.appendChild(count);

    const grid = document.createElement("div");
    grid.className = "grid";

    cat.items.forEach((item, index) => {
      const div = document.createElement("div");
      let cls = "item";
      if (index >= VISIBLE_COUNT_MOBILE){
        cls += " extra";
      } else if (index >= VISIBLE_COUNT_DESKTOP){
        cls += " extra mobile-visible";
      }
      div.className = cls;
      div.innerHTML = `
        <a class="thumb" href="${item.link}" target="_blank" rel="noopener sponsored">
          <img src="${item.image}" alt="${item.name}" loading="lazy">
        </a>
        <div class="name">${item.name}</div>
        ${item.note ? `<div class="note">${item.note}</div>` : ``}
        <a class="cta" href="${item.link}" target="_blank" rel="noopener sponsored">Xem trên Shopee →</a>
      `;
      grid.appendChild(div);
    });

    section.appendChild(grid);

    if(cat.items.length > VISIBLE_COUNT_DESKTOP){
      const wrap = document.createElement("div");
      wrap.className = "view-all-wrap";
      if (cat.items.length <= VISIBLE_COUNT_MOBILE){
        wrap.classList.add("mobile-hide");
      }
      const btn = document.createElement("button");
      btn.className = "view-all";
      btn.textContent = "Xem tất cả (" + cat.items.length + " sản phẩm)";
      btn.addEventListener("click", () => {
        const expanded = section.classList.toggle("expanded");
        btn.textContent = expanded
          ? "Thu gọn"
          : "Xem tất cả (" + cat.items.length + " sản phẩm)";
      });
      wrap.appendChild(btn);
      section.appendChild(wrap);
    }
  }

  bandInner.appendChild(section);
  band.appendChild(bandInner);
  main.appendChild(band);
  sections.push(section);
});

/* Đánh dấu tab đang chọn theo mục đang cuộn tới trong khung nhìn */
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    const idx = sections.indexOf(entry.target);
    if (idx === -1) return;
    if (entry.isIntersecting){
      navLinks.forEach(l => l.classList.remove("active"));
      navLinks[idx].classList.add("active");
    }
  });
}, { rootMargin: "-40% 0px -55% 0px", threshold: 0 });

sections.forEach(s => observer.observe(s));

if (navLinks.length){
  navLinks[0].classList.add("active");
}
</script>

</body>
</html>
